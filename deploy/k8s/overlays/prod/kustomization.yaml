apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todo-devops-prod

resources:
  - namespace.yaml
  - ../../base

# This overlay deploys only the todo-web-app workload.
# PostgreSQL, Kafka, Prometheus, and Grafana remain external prerequisites.
configMapGenerator:
  - name: todo-web-app-config
    envs:
      - configmap.env

# Placeholder values are committed for rendering only; use real secrets through the target environment.
secretGenerator:
  - name: todo-web-app-secret
    envs:
      - secret.env

images:
  - name: ghcr.io/xorl-ldaf/todo-devops
    newName: ghcr.io/xorl-ldaf/todo-devops
    newTag: latest

patches:
  - path: deployment-patch.yaml
  - path: ingress-patch.yaml
